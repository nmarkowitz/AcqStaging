[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acq-staging"
version = "0.1.0"
description = "Safe PyQt6 motion control for OCT staging hardware"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6==6.11.0",
    "pythonnet==3.1.0",
    "zaber-motion==9.3.2",
    "nidaqmx==1.5.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.15.22",
]

[project.scripts]
acq-staging = "acq_staging.app:main"
acq-staging-diagnostic = "acq_staging.diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not hardware'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: requires physical hardware",
    "requires_home: requires an explicit hardware homing request",
    "requires_motion: requires an explicit hardware motion request",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["acq_staging"]

[[tool.mypy.overrides]]
module = ["zaber_motion.*", "nidaqmx.*", "clr", "System.*", "Thorlabs.*"]
ignore_missing_imports = true
